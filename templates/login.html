{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>Login</h1>

    {% if request.query_params.get("error") %}

        <div class="error">
            {{ request.query_params.get("error") }}
        </div>

    {% endif %}

    <form
        method="post"
        action="/login"
    >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">
            Register
        </a>
    </p>

</div>

{% endblock %}
